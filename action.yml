name: workflow-guard
description: Scan GitHub Actions workflows for security and maintainability risks.
author: yclalone

inputs:
  path:
    description: Workflow file, directory, or repository root to scan.
    required: false
    default: .
  format:
    description: Report format (text, json, markdown, or sarif).
    required: false
    default: text
  output:
    description: Optional path to write the report. Leave empty to print to the log.
    required: false
    default: ""
  fail-on:
    description: Minimum severity that makes the action fail (none, low, medium, high, or critical).
    required: false
    default: high

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: "3.12"
    - name: Install workflow-guard
      shell: bash
      run: python -m pip install --disable-pip-version-check "$GITHUB_ACTION_PATH"
    - name: Scan workflows
      shell: bash
      env:
        WORKFLOW_GUARD_PATH: ${{ inputs.path }}
        WORKFLOW_GUARD_FORMAT: ${{ inputs.format }}
        WORKFLOW_GUARD_OUTPUT: ${{ inputs.output }}
        WORKFLOW_GUARD_FAIL_ON: ${{ inputs.fail-on }}
      run: |
        args=("$WORKFLOW_GUARD_PATH" --format "$WORKFLOW_GUARD_FORMAT" --fail-on "$WORKFLOW_GUARD_FAIL_ON")
        if [[ -n "$WORKFLOW_GUARD_OUTPUT" ]]; then
          args+=(--output "$WORKFLOW_GUARD_OUTPUT")
        fi
        workflow-guard "${args[@]}"

branding:
  icon: shield
  color: blue
