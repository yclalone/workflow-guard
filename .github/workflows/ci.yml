name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.9", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e .
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Scan this repository
        run: workflow-guard . --fail-on medium

  action-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run the local action
        uses: ./
        with:
          path: examples/risky-workflow.yml
          format: sarif
          output: ${{ runner.temp }}/workflow-guard.sarif
          fail-on: high
          ignore-rules: WG002,WG006,WG007
      - name: Validate SARIF output
        shell: bash
        run: |
          python -m json.tool "${{ runner.temp }}/workflow-guard.sarif" > /dev/null
          python -c 'import json, os; p=json.load(open(os.environ["REPORT"])); assert {r["ruleId"] for r in p["runs"][0]["results"]} == {"WG004", "WG005"}'
        env:
          REPORT: ${{ runner.temp }}/workflow-guard.sarif
